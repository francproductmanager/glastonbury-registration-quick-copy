name: SEO reviewer canary

# Checks the SEO reviewer agents actually catch errors (see site-src/SEO-AUDITOR.md).
# On the first Monday of each month this opens a writer style pull request with one known wrong
# fact planted in an otherwise unchanged guide. The planted errors live in the CANARY_CASES secret,
# never in the repo, so a reviewer reading the repo can't recognise one; a different one each month.
# At 1pm UTC the same day (before the writer's fix run) it checks the verdicts on the planted commit:
# both reviewers should have failed it. If either passed it, or neither reviewed it, it opens an issue.
# The merge gate never merges a writer branch opened by GitHub Actions, so a canary never goes live.
# One planted error a month is a smoke alarm, not a measurement.
on:
  schedule:
    - cron: "0 8 * * 1" # first Monday of the month, 8am UTC: plant
    - cron: "0 13 * * 1" # same day, 1pm UTC: check
  workflow_dispatch:
    inputs:
      step:
        description: "plant or check"
        required: true
        default: plant

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Decide what to do today
        id: when
        env:
          STEP: ${{ github.event.inputs.step }}
        run: |
          day=$(date -u +%-d); hour=$(date -u +%-H)
          if [ -n "$STEP" ]; then echo "step=$STEP" >> "$GITHUB_OUTPUT"
          elif [ "$day" -le 7 ] && [ "$hour" -lt 12 ]; then echo "step=plant" >> "$GITHUB_OUTPUT"
          elif [ "$day" -le 7 ]; then echo "step=check" >> "$GITHUB_OUTPUT"
          else echo "step=none" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.when.outputs.step == 'plant'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.when.outputs.step == 'plant'
        with:
          node-version: 22
      - name: Plant a known wrong fact and open a pull request
        if: steps.when.outputs.step == 'plant'
        env:
          GH_TOKEN: ${{ github.token }}
          CASES: ${{ secrets.CANARY_CASES }}
        run: |
          today=$(date -u +%Y-%m-%d)
          # Pick this month's case; skip any whose text the guides no longer contain
          case_json=$(node -e '
            const cases = JSON.parse(process.env.CASES || "[]"), fs = require("fs");
            const src = fs.readFileSync("site-src/content.mjs", "utf8"), d = new Date();
            const start = (d.getUTCFullYear() * 12 + d.getUTCMonth()) % (cases.length || 1);
            for (let i = 0; i < cases.length; i++) {
              const c = cases[(start + i) % cases.length];
              if (src.includes(c.from)) { fs.writeFileSync("site-src/content.mjs", src.replace(c.from, c.to)); console.log(JSON.stringify(c)); process.exit(0); }
            }
            process.exit(1);') || { gh issue create --title "SEO reviewer canary couldn't plant an error" --body "None of the CANARY_CASES texts are in the guides any more. Add new cases to the secret."; exit 0; }
          where=$(node -e 'console.log(JSON.parse(process.argv[1]).where)' "$case_json")
          what=$(node -e 'console.log(JSON.parse(process.argv[1]).what)' "$case_json")
          node site-src/build.mjs
          branch="seo-agent/$today"
          git ls-remote --exit-code --heads origin "$branch" >/dev/null && branch="$branch-b"
          printf '# Writer run %s\n\nRechecked %s against the official ticket information and corrected %s.\n' "$today" "$where" "$what" > "site-src/log/$today-writer.md"
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"; git add -A; git commit -q -m "Refresh $where"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "SEO writer: $today" --body "Rechecked $where against the official ticket information and corrected $what. No new guide this run."
      - name: Check the reviewers caught it, then close it
        if: steps.when.outputs.step == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --repo "$REPO" --state open --author "app/github-actions" --json number,headRefName --jq '.[] | select(.headRefName | startswith("seo-agent/")) | .number'); do
            sha=$(gh pr view "$pr" --repo "$REPO" --json commits --jq '.commits[0].oid') # the planted commit, even if something pushed after it
            # Verdicts are commit statuses or, since the cloud proxy refuses status writes, the reviewers' comments
            states=$( { gh api "repos/$REPO/commits/$sha/status" --jq '.statuses[] | select(.context | startswith("seo-review/")) | "\(.context)=\(.state)"'
              gh api --paginate "repos/$REPO/issues/$pr/comments" --jq ".[] | select(.user.login == \"${REPO%%/*}\") | .body | capture(\"^SEO review (?<p>[ab]): (?<v>PASS|FAIL) for $sha\") | \"seo-review/\(.p)=\(if .v == \"PASS\" then \"success\" else \"failure\" end)\""
            } | sort -u | paste -sd' ')
            echo "Canary #$pr verdicts: ${states:-none}"
            if [ -z "$states" ]; then result="Neither reviewer reviewed it."
            elif echo "$states" | grep -q "=success"; then result="A reviewer PASSED a pull request with a planted wrong fact: $states"
            elif echo "$states" | grep -q "seo-review/a=failure" && echo "$states" | grep -q "seo-review/b=failure"; then result=""
            else result="Only one reviewer gave a verdict: $states"; fi
            if [ -n "$result" ]; then
              gh issue create --repo "$REPO" --title "SEO reviewer canary failed: #$pr" --body "The monthly canary planted one known wrong fact in #$pr. $result Check the reviewer routines at https://claude.ai/code/routines before trusting new guides."
              gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Closed: monthly check, missed. See the issue opened for it."
            else
              gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Closed: this was the monthly reviewer check, and both reviewers caught the planted error. It never goes live."
            fi
          done
