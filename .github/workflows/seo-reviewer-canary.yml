name: SEO reviewer canary

# Checks the SEO reviewer agents actually catch errors (see site-src/SEO-AUDITOR.md).
# On the first Monday of each month this opens a writer style pull request with one known wrong
# fact planted in an otherwise unchanged guide. The reviewers can't tell it from a real one.
# Five hours later (before the writer's 3pm fix run) it checks their verdicts on the planted commit: both should have failed it. If either passed
# it, or neither reviewed it, it opens an issue. The merge workflow never merges pull requests
# opened by GitHub Actions, so a canary can never go live.
on:
  schedule:
    - cron: "0 8 * * 1" # first Monday of the month, 8am UTC: plant
    - cron: "0 13 * * 1" # same day, 1pm UTC: check
  workflow_dispatch:
    inputs:
      step:
        description: "plant or check"
        required: true
        default: plant

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Decide what to do today
        id: when
        env:
          STEP: ${{ github.event.inputs.step }}
        run: |
          day=$(date -u +%-d); hour=$(date -u +%-H)
          if [ -n "$STEP" ]; then echo "step=$STEP" >> "$GITHUB_OUTPUT"
          elif [ "$day" -le 7 ] && [ "$hour" -lt 12 ]; then echo "step=plant" >> "$GITHUB_OUTPUT"
          elif [ "$day" -le 7 ]; then echo "step=check" >> "$GITHUB_OUTPUT"
          else echo "step=none" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.when.outputs.step == 'plant'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.when.outputs.step == 'plant'
        with:
          node-version: 22
      - name: Plant a known wrong fact and open a pull request
        if: steps.when.outputs.step == 'plant'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          # A different error each month, each a plausible slip a writer could make
          case $(( $(date -u +%-m) % 3 )) in
            0) from='"General admission ticket", "£408, including a £5 booking fee"'; to='"General admission ticket", "£418, including a £5 booking fee"' ;;
            1) from='"Thu 1 to Wed 7 April 2027", "Balance payment window'; to='"Thu 8 to Wed 14 April 2027", "Balance payment window' ;;
            2) from='"Deposit paid on ticket day", "£100 per ticket'; to='"Deposit paid on ticket day", "£75 per ticket' ;;
          esac
          FROM="$from" TO="$to" node -e '
            const fs = require("fs"), p = "site-src/content.mjs", s = fs.readFileSync(p, "utf8");
            if (!s.includes(process.env.FROM)) { console.error("Canary fact not found; update this workflow"); process.exit(1); }
            fs.writeFileSync(p, s.replace(process.env.FROM, process.env.TO));'
          node site-src/build.mjs
          printf '# Writer run %s\n\nRechecked the 2027 key dates guide against the official ticket information and corrected one figure.\n' "$today" > "site-src/log/$today-writer.md"
          branch="seo-agent/$today"
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"; git add -A; git commit -q -m "Refresh the 2027 key dates guide"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "SEO writer: $today" --body "Rechecked the 2027 key dates guide against the official ticket information and corrected one figure."
      - name: Check the reviewers caught it, then close it
        if: steps.when.outputs.step == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --repo "$REPO" --state open --author "app/github-actions" --json number,headRefName --jq '.[] | select(.headRefName | startswith("seo-agent/")) | .number'); do
            sha=$(gh pr view "$pr" --repo "$REPO" --json commits --jq '.commits[0].oid') # the planted commit, even if something pushed after it
            states=$(gh api "repos/$REPO/commits/$sha/status" --jq '[.statuses[] | select(.context | startswith("seo-review/")) | "\(.context)=\(.state)"] | join(" ")')
            echo "Canary #$pr verdicts: ${states:-none}"
            if [ -z "$states" ]; then result="Neither reviewer reviewed it."
            elif echo "$states" | grep -q "=success"; then result="A reviewer PASSED a pull request with a planted wrong fact: $states"
            elif echo "$states" | grep -q "seo-review/a=failure" && echo "$states" | grep -q "seo-review/b=failure"; then result=""
            else result="Only one reviewer gave a verdict: $states"; fi
            if [ -n "$result" ]; then
              gh issue create --repo "$REPO" --title "SEO reviewer canary failed: #$pr" --body "The monthly canary planted one known wrong fact in #$pr. $result Check the reviewer routines at https://claude.ai/code/routines before trusting new guides."
              gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Reviewer canary: missed. See the issue opened for it."
            else
              gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Reviewer canary: both reviewers caught the planted error. Closing; this was a test and never goes live."
            fi
          done
