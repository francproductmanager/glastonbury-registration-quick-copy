name: Live site matches source

# Publicly checks that https://glastoquickcopy.netlify.app serves exactly the code in this repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the live site with this commit
        run: TRIES=20 bash scripts/verify-live.sh
