name: Merge SEO agent pull requests

# The only thing that publishes the SEO agents' work (see site-src/SEO-AUDITOR.md). The rules are in
# scripts/seo-merge-gate.mjs, always run from main so no agent can change them.
# Kill switch: does nothing unless the repo variable AUTOMERGE_ENABLED is "true".
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
  status:
  issue_comment: # reviewers' verdict comments, since the cloud proxy refuses status writes
    types: [created]
  schedule:
    - cron: "17 * * * *" # hourly sweep: tests started by a workflow don't send the signal above
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: seo-agent-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >
      vars.AUTOMERGE_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'status' && github.event.state == 'success' && startsWith(github.event.context, 'seo-review/')) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, 'SEO review ')) ||
       github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the gate compares the reviewed commit with what would be merged
      - name: Merge if every rule is met
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.sha }} # empty on the hourly sweep: check every open agent pull request
          REQUIRE_SIGNED_REVIEWS: ${{ vars.REQUIRE_SIGNED_REVIEWS }} # "true": review passes must be signed by the reviewers' own key
          REVIEW_SIGNING_KEY: ${{ secrets.REVIEW_SIGNING_KEY }}
        run: node scripts/seo-merge-gate.mjs
