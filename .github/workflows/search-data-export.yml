name: Search data export

# Every Sunday morning, before the SEO auditor's 6pm run, this pulls real search numbers from Google
# Search Console into site-src/data/ (scripts/search-data-export.mjs) and opens a pull request that the
# merge gate publishes once the tests pass. Plain code: no agent ever holds a Google credential.
# Google sign in is keyless (Workload Identity Federation): Google only hands a short-lived read-only
# token to this workflow, running from main, in the "search-data" environment (which only main can use).
# Does nothing until the repo variables GCP_WIF_PROVIDER and GCP_SERVICE_ACCOUNT are set.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  id-token: write # lets Google check this really is this workflow in this repo

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: search-data
    steps:
      - name: Check Search Console is connected
        id: ready
        run: if [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Search Console isn't connected yet (GCP_WIF_PROVIDER and GCP_SERVICE_ACCOUNT aren't set), so there is nothing to export."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          fetch-depth: 0 # first published dates come from git history
      - name: Sign in to Google (read only, short lived)
        id: google
        if: steps.ready.outputs.ok == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Export and open a pull request
        if: steps.ready.outputs.ok == 'true'
        env:
          GSC_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/search-data-export.mjs
          today=$(date -u +%Y-%m-%d); branch="seo-data/$today"
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"; git add site-src/data
          git commit -q -m "Search data for the week to $today"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "Search data: $today" --body "This week's Search Console numbers for the SEO auditor. Data files only."
          # Pushes by this workflow don't start other workflows, so start the tests for the merge gate
          gh workflow run test.yml --ref "$branch"
      - name: Report a failed export
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Search data export failed" --body "This week's Search Console export failed, so the SEO auditor would plan from old data. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
