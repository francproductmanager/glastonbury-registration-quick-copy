name: SEO merge watchdog

# The SEO agents act on GitHub as the owner, so one could in principle merge its own pull request
# through the API instead of waiting for the merge gate. This can't stop that, but it makes it loud:
# any agent branch that reaches main without the gate opens an issue.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check agent work came through the merge gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | "\(.number) \(.head.ref)"' | while read -r pr branch; do
            case "$branch" in seo-agent/*|seo-audit/*|seo-data/*) ;; *) continue ;; esac
            by=$(gh api "repos/$REPO/pulls/$pr" --jq '.merged_by.login')
            if [ "$by" != "github-actions[bot]" ]; then
              gh issue create --repo "$REPO" --title "SEO agent work merged outside the gate: #$pr" --body "#$pr ($branch) was merged by $by, not by the merge gate. If you didn't do this yourself, an agent bypassed the gate: set the repo variable AUTOMERGE_ENABLED to false, pause the routines at https://claude.ai/code/routines, and check the change."
            fi
          done
