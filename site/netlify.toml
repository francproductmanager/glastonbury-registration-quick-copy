# Guides site: deploy as a separate Netlify site with base directory "site".
# It runs Google AdSense, so it lives on its own address, separate from the tool,
# and ad code can never read the tool's saved data.
[build]
  publish = "."
  command = "sh deploy.sh"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Don't publish the build script
[[redirects]]
  from = "/deploy.sh"
  to = "/404.html"
  status = 404
  force = true
