[build]
  publish = "."
  # Stamp the deployed commit into the pages so the footer can show it.
  # This is the only change made at deploy time; everything else is served exactly as in the repo.
  command = "sed -i \"s/__COMMIT_REF__/${COMMIT_REF:-unknown}/\" index.html demo.html"

# The site shows Google AdSense ads, so scripts, images, frames and connections from Google's
# ad servers must be allowed. Google's ad domains change over time, so this follows Google's own
# guidance for ad pages (https: sources) and keeps every protection that doesn't affect ads:
# no plugins, no <base> hijacking, no form submissions, and no other site can embed these pages.
# The tool's own code (app.js) still makes no network requests at all; a test checks this.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always check for a fresh copy so phones never run an outdated app.js
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/calendar/*"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"
    Content-Disposition = "attachment"
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Sources and tooling stay in the repo, not on the website
[[redirects]]
  from = "/site-src/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Guides that were merged or moved. Permanent redirects keep old links and search results working.
[[redirects]]
  from = "/guides/glastonbury-booking-problems"
  to = "/guides/paying-for-glastonbury-tickets/"
  status = 301
  force = true
[[redirects]]
  from = "/guides/ticket-day-mistakes"
  to = "/guides/ticket-day-checklist/"
  status = 301
  force = true
[[redirects]]
  from = "/guides/glasto-quick-copy-on-ticket-day"
  to = "/guides/how-to-use-glasto-quick-copy/"
  status = 301
  force = true
[[redirects]]
  from = "/guides/resale-and-coach-tickets"
  to = "/guides/glastonbury-2027-resale/"
  status = 301
  force = true
