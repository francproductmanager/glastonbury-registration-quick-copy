[build]
  publish = "."
  # Stamp the deployed commit into the pages so the footer can show it.
  # This is the only change made at deploy time; everything else is served exactly as in the repo.
  command = "sed -i \"s/__COMMIT_REF__/${COMMIT_REF:-unknown}/\" index.html demo.html"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always check for a fresh copy so phones never run an outdated app.js
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
